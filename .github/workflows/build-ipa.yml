name: Build IPA

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler NotifApp.ipa
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version de Xcode
        run: xcodebuild -version

      # Pas de signature ici : le .ipa est signé au moment de l'installation (Sideloadly, AltStore...).
      - name: Compiler l'app
        run: |
          xcodebuild build \
            -project NotifApp.xcodeproj \
            -target NotifApp \
            -configuration Release \
            -sdk iphoneos \
            -quiet \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Créer NotifApp.ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/NotifApp.app Payload/
          plutil -p Payload/NotifApp.app/Info.plist
          zip -qry NotifApp.ipa Payload
          ls -lh NotifApp.ipa

      - name: Envoyer le .ipa comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: NotifApp-ipa
          path: NotifApp.ipa
          if-no-files-found: error

      - name: Publier le .ipa dans les Releases
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NotifApp.ipa \
            --target "$GITHUB_SHA" \
            --title "NotifApp (dernière version)" \
            --notes "Compilé automatiquement depuis le commit $GITHUB_SHA. Le .ipa n'est pas signé : installe-le avec Sideloadly, AltStore ou SideStore (voir le README)."

  # Vérifie que l'app démarre et enregistre une capture d'écran (artefact « apercu »).
  apercu:
    name: Aperçu dans le simulateur
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Démarrer un simulateur iPhone
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E '^ +iPhone' | grep -oE '[0-9A-F-]{36}')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"

      - name: Compiler pour le simulateur
        run: |
          xcodebuild build \
            -project NotifApp.xcodeproj \
            -target NotifApp \
            -configuration Release \
            -sdk iphonesimulator \
            -quiet \
            ARCHS=arm64 \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO

      - name: Lancer l'app et faire une capture d'écran
        run: |
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100
          xcrun simctl install "$UDID" build/Release-iphonesimulator/NotifApp.app
          xcrun simctl launch "$UDID" com.ramphortpl.notifapp
          sleep 8
          pgrep -fl "NotifApp.app/NotifApp" || { echo "::error::L'app s'est arrêtée juste après son lancement"; exit 1; }
          xcrun simctl io "$UDID" screenshot apercu.png

      # L'écran de l'iPad, plus haut, montre tout le formulaire. Étape facultative.
      - name: Capture d'écran sur iPad
        continue-on-error: true
        run: |
          IPAD=$(xcrun simctl list devices available | grep -m1 -E '^ +iPad Pro' | grep -oE '[0-9A-F-]{36}') || { echo "Pas de simulateur iPad"; exit 0; }
          xcrun simctl boot "$IPAD"
          xcrun simctl bootstatus "$IPAD" -b
          xcrun simctl status_bar "$IPAD" override --time 9:41 --batteryState charged --batteryLevel 100
          xcrun simctl install "$IPAD" build/Release-iphonesimulator/NotifApp.app
          # -speed fast : ouvre en vitesse Rapide pour montrer aussi « Un son par notification ».
          xcrun simctl launch "$IPAD" com.ramphortpl.notifapp -speed fast
          sleep 8
          xcrun simctl io "$IPAD" screenshot apercu-ipad.png

      - uses: actions/upload-artifact@v4
        with:
          name: apercu
          path: apercu*.png
          if-no-files-found: error
